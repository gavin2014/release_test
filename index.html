<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Release Desk · 软件发布管理台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23e36841'/%3E%3Cpath d='M12 27V13h9a5 5 0 0 1 0 10h-9m8 0 7 7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <meta name="release-desk-mode" content="browser">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="./vendor/markdown-it.min.js" defer></script>
  <script src="./vendor/js-yaml.min.js" defer></script>
  <script src="./vendor/sha256.min.js" defer></script>
  <script src="./browser-api.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./index.html"><span class="brand-icon">R<span>↗</span></span><span>Release Desk<small>软件发布工作台</small></span></a>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航">
      <button data-page="releases" class="nav active"><span class="nav-icon">◈</span>版本总览<span class="nav-dot"></span></button>
      <button data-page="jobs" class="nav"><span class="nav-icon">↗</span>发布任务<span id="task-count" class="nav-count">0</span></button>
      <button data-page="routes" class="nav"><span class="nav-icon">⇄</span>下载线路</button>
      <button data-page="settings" class="nav"><span class="nav-icon">⚙</span>仓库配置</button>
    </nav>
    <div class="sidebar-note"><div class="live-indicator"><i></i> 浏览器工作空间</div><p>从版本说明到下载链接，<br>让发布有迹可循。</p><span>GitHub REST API</span></div>
    <div class="sidebar-footer"><span class="avatar">RD</span><div>静态管理台<small>凭据保存在当前浏览器</small></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">版本总览</strong></div><div class="topbar-right"><span class="local-label"><i></i> 浏览器直连</span><label class="sr-only" for="project-picker">当前仓库</label><select id="project-picker"><option value="">尚未连接仓库</option></select><button class="icon-button" id="add-project" title="添加仓库" aria-label="添加仓库">＋</button></div></header>
    <main id="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span>正在读取工作空间…</div></main>
    <footer class="page-footer"><span>RELEASE DESK <b> / </b> 从这里，把新版本交给用户。</span><span>v0.2.0 · GITHUB PAGES</span></footer>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
